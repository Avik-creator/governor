# Example configuration for governord. A dollar sign followed by a name in
# braces is replaced by that environment variable, anywhere in this file and
# even inside comments. governord refuses to start if a variable is not set.

listen: 127.0.0.1:7600

# The Postgres that holds the durable record. Leave empty to keep everything in
# memory, in which case nothing survives a restart.
database_url: ${GOVERNOR_DATABASE_URL}

# How often expired sessions, leases and deadlines are applied.
reap_interval: 1s

# How long an ended task stays known before it is removed from memory. Its usage
# still counts against its tenant afterwards.
node_retention: 24h

# How many changes may be recorded before the whole state is saved as a snapshot.
# A restart loads the snapshot and replays only what came after it.
snapshot_every: 10000

# Opens sessions that may act on every tenant. Leave empty to allow none.
admin_key: ${GOVERNOR_ADMIN_KEY}

# The root's limits are the shared pools every tenant draws from.
root:
  limits:
    db: 20
    http: 50

# Limits tuned from what their leases report: the limit rises by one while the
# downstream is healthy and is cut to 70% when it is slow or signals overload.
# The limit in root above is where the controller starts.
adaptive:
  - class: db
    target_p95: 50ms    # 95th percentile latency to stay under
    max_overload: 0.05  # share of releases that may report overload
    min_limit: 2
    max_limit: 40
    interval: 1s
    min_samples: 20

# One node per tenant. A tenant is matched by name across restarts, and only
# its limits are re-applied when this file changes.
tenants:
  - name: team-a
    api_key: ${TEAM_A_KEY}
    weight: 3
    quotas:
      http: 100000
      tool_calls: 5000
    limits:
      agents: 5

  - name: team-b
    api_key: ${TEAM_B_KEY}
